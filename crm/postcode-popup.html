<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CRM 주소 검색</title><style>html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#fff}header{padding:14px 18px;background:#232922;color:white;font-weight:700}#postcode{height:calc(100dvh - 90px);min-height:360px}#notice{padding:10px 18px;font-size:13px;color:#555}#error{display:none;padding:20px;color:#b11}</style></head><body><header>RENAULT · 주소 검색</header><div id="postcode"></div><div id="notice">주소를 선택하면 CRM 고객등록 화면에 자동으로 입력됩니다. 선택 후 이전 탭으로 돌아가세요.</div><div id="error">주소검색을 불러오지 못했습니다. 창을 닫고 다시 시도해 주세요.</div><script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" onerror="document.getElementById('error').style.display='block'"></script><script>try{const token=decodeURIComponent(location.hash.slice(1));if(!/^[0-9a-f-]{36}$/.test(token)||!window.daum||!daum.Postcode||!window.BroadcastChannel)throw Error('unavailable');const channel=new BroadcastChannel('crm-postcode-'+token);new daum.Postcode({oncomplete:function(data){const zonecode=String(data.zonecode||'');const address=String(data.roadAddress||data.jibunAddress||data.address||'');if(!/^\d{5}$/.test(zonecode)||!address)return;channel.postMessage({type:'crm-postcode-selected',token:token,zonecode:zonecode,address:address});document.getElementById('notice').textContent='주소가 CRM에 전달되었습니다. 이전 탭으로 돌아가세요.';setTimeout(function(){window.close()},350)},width:'100%',height:'100%'}).embed(document.getElementById('postcode'))}catch(e){document.getElementById('error').style.display='block'}</script></body></html>
