<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>르노 CRM 주소 검색</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#f7f7f4;color:#222}header{padding:16px;background:#232922;color:#fff;font-weight:700}.wrap{padding:14px}.button{display:block;box-sizing:border-box;width:100%;border:0;border-radius:8px;padding:16px;background:#ffe000;font-size:17px;font-weight:700;color:#111;cursor:pointer}#status{padding:14px 2px;line-height:1.6;font-size:14px}#postcode{height:65vh;min-height:360px;background:white;border:1px solid #ddd}#fallback{margin-top:12px}#fallback button{background:#fff;border:1px solid #777}#result{white-space:pre-wrap;font-size:15px}</style></head>
<body><header>RENAULT · 주소 검색</header><main class="wrap"><button id="launch" class="button" type="button">주소검색 시작하기</button><div id="status" role="status">주소검색 버튼을 눌러주세요. 검색창이 비어 있으면 아래의 새 창 검색을 이용하세요.</div><div id="postcode"></div><div id="fallback"><button id="newWindow" class="button" type="button">새 창으로 주소검색 열기</button></div><button id="closeTab" class="button" type="button" hidden style="margin-top:12px;background:#232922;color:#fff">주소 입력 완료 · 검색창 닫기</button><p id="result"></p></main>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" onerror="document.getElementById('status').textContent='카카오 주소검색 스크립트를 불러오지 못했습니다. 인터넷 연결 및 콘텐츠 차단 설정을 확인해 주세요.'"></script>
<script>
(function(){
'use strict';
const status=document.getElementById('status'),token=decodeURIComponent(location.hash.slice(1));
const valid=/^[0-9a-f-]{36}$/i.test(token);
let channel=null;
try{if(valid&&window.BroadcastChannel)channel=new BroadcastChannel('crm-postcode-'+token)}catch(e){}
function selected(data){
 const zonecode=String(data.zonecode||''),address=String(data.roadAddress||data.jibunAddress||data.address||'');
 if(!/^\d{5}$/.test(zonecode)||!address)return;
 if(channel){channel.postMessage({type:'crm-postcode-selected',token,zonecode,address});status.textContent='주소 선택 완료. CRM 탭으로 돌아가세요.'}
 else status.textContent='자동 전달이 지원되지 않습니다. 아래 주소를 복사해 CRM에 입력해 주세요.';
 document.getElementById('result').textContent=zonecode+'\n'+address;\n if(channel){const button=document.getElementById('closeTab');button.hidden=false;setTimeout(function(){window.close();if(!window.closed){status.textContent='주소가 CRM에 반영되었습니다. 자동으로 닫히지 않으면 아래 버튼을 누르거나 CRM 탭으로 돌아가세요.'}},450)}
}
function make(){if(!window.daum||!daum.Postcode){status.textContent='카카오 주소검색 로딩에 실패했습니다. 콘텐츠 차단 기능을 확인한 후 새로고침해 주세요.';return null}return new daum.Postcode({oncomplete:selected,width:'100%',height:'100%'})}
document.getElementById('closeTab').addEventListener('click',function(){window.close();if(!window.closed){status.textContent='삼성 인터넷이 자동 닫기를 제한하고 있습니다. 브라우저의 뒤로가기 또는 탭 닫기를 눌러주세요.'}});\ndocument.getElementById('launch').addEventListener('click',function(){try{const p=make();if(!p)return;p.embed(document.getElementById('postcode'));status.textContent='주소를 검색해 선택해 주세요. 빈 화면이면 아래 새 창 검색을 누르세요.'}catch(e){status.textContent='내장 검색창을 표시할 수 없습니다. 새 창 검색을 이용해 주세요.'}});
document.getElementById('newWindow').addEventListener('click',function(){try{const p=make();if(p)p.open()}catch(e){status.textContent='새 창을 열지 못했습니다. 브라우저 팝업 차단 설정을 확인해 주세요.'}});
})();
</script></body></html>
