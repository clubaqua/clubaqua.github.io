<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://gialghctlilvcxduwmgl.supabase.co; img-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"><title>딜러 CRM · Claude안</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* Layout: PC = 얇은 사이드바 + 상단 검색바 + 본문(고객은 목록|상세 분할). 폰 = 하단 탭 5칸 + 전체화면 시트 + 빠른 작업 버튼 */
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
 --bg:#F4F5F8;--surface:#FFFFFF;--surface-2:#EDEFF4;--line:#E1E4EB;--fg:#12151C;--muted:#5C6371;--faint:#8A909C;
 --accent:#2F44E8;--accent-fg:#FFFFFF;--accent-soft:#E6E9FF;
 --ok:#0B7A55;--ok-soft:#DDF3EA;--warn:#A85A06;--warn-soft:#FCEFD9;--danger:#B42323;--danger-soft:#FBE4E4;--ink-soft:#E4E6EC;
 --shadow:0 1px 2px rgba(18,21,28,.06),0 8px 24px rgba(18,21,28,.06);
 --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --num:"Inter Tight","IBM Plex Sans KR",system-ui,sans-serif;
 --r-lg:18px;--r-md:12px;--r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0C0E13;--surface:#14171F;--surface-2:#1B1F29;--line:#262B36;--fg:#ECEEF3;--muted:#9AA1AE;--faint:#6E7583;
 --accent:#7D8CFF;--accent-fg:#0C0E13;--accent-soft:#1D2250;
 --ok:#3BD19A;--ok-soft:#0C3024;--warn:#F2A541;--warn-soft:#38270C;--danger:#F47A7A;--danger-soft:#3A1416;--ink-soft:#262A35;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0C0E13;--surface:#14171F;--surface-2:#1B1F29;--line:#262B36;--fg:#ECEEF3;--muted:#9AA1AE;--faint:#6E7583;
 --accent:#7D8CFF;--accent-fg:#0C0E13;--accent-soft:#1D2250;
 --ok:#3BD19A;--ok-soft:#0C3024;--warn:#F2A541;--warn-soft:#38270C;--danger:#F47A7A;--danger-soft:#3A1416;--ink-soft:#262A35;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
/* 사이드바 */
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;letter-spacing:-.02em}
.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--num);font-size:14px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.side-foot b{color:var(--fg)}
/* 상단 */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.search-trigger{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--faint);text-align:left}
.search-trigger:hover{border-color:var(--faint)}
.search-trigger svg{width:17px;height:17px}
kbd{font-family:var(--num);font-size:11.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.search-trigger kbd{margin-left:auto}
.top-actions{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--faint)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.icon-btn{width:38px;height:38px;padding:0}
.content{padding-block:8px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:10px 0 20px}
.view-head h1{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
.view-head p{margin:4px 0 0;color:var(--muted)}
/* 칩·배지 */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.st-new{background:var(--accent-soft);color:var(--accent)}
.st-talk{background:var(--surface-2);color:var(--fg)}
.st-contract{background:var(--ok-soft);color:var(--ok)}
.st-done{background:var(--ink-soft);color:var(--fg)}
.st-hold{background:var(--warn-soft);color:var(--warn)}
.st-end{background:var(--surface-2);color:var(--faint)}
.flag-warn{background:var(--warn-soft);color:var(--warn)}
.flag-danger{background:var(--danger-soft);color:var(--danger)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--num)}
/* 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-head .count{font-family:var(--num);color:var(--muted);font-weight:600}
/* 오늘: 벤토 */
.hello{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;margin:14px 0 22px}
.hello h1{margin:0;font-size:30px;letter-spacing:-.035em;font-weight:700}
.hello .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.hello .stats b{font-family:var(--num);color:var(--fg);font-size:17px;margin-right:3px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.b-calls{grid-column:span 7;grid-row:span 2}
.b-intake{grid-column:span 5}
.b-alerts{grid-column:span 5}
.b-week{grid-column:span 7}
.b-funnel{grid-column:span 5}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.row-title button.link{border:0;background:none;padding:0;font-weight:600;font-size:15px}
.row-title button.link:hover{color:var(--accent)}
.row-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:flex;gap:6px}
.due-over{color:var(--danger);font-weight:600}
.due-today{color:var(--accent);font-weight:600}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border-radius:12px;background:var(--surface-2);padding:10px 8px;min-height:104px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.is-today{background:var(--accent-soft)}
.day-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.day-label b{font-family:var(--num);color:var(--fg);font-size:15px}
.day.is-today .day-label b{color:var(--accent)}
.day-item{font-size:12px;line-height:1.35;padding:6px;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;cursor:pointer}
.day-item b{display:block;font-size:12.5px}
.funnel{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--num)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.kpi{padding:12px;border-radius:12px;background:var(--surface-2)}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--num);font-size:22px;letter-spacing:-.02em}
/* 고객 */
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab .n{font-family:var(--num);font-size:12.5px;color:var(--faint)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.field-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field-search svg{width:16px;height:16px;color:var(--faint);flex:none}
.field-search input{flex:1;border:0;background:none;padding:9px 0;outline:none;min-width:0;font-size:16px}
.select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.split.no-detail{grid-template-columns:minmax(0,1fr)}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 250px)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.cell-name b{display:block;font-weight:600}
.cell-name span{font-size:12.5px;color:var(--muted)}
.cards{display:none;flex-direction:column;gap:10px}
.c-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.c-card .l1{display:flex;gap:8px;align-items:center;font-weight:700;font-size:16px}
.c-card .l2{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* 상세 */
.detail{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);max-height:calc(100vh - 96px);overflow:auto;display:flex;flex-direction:column}
.d-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2}
.d-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.d-name{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0}
.d-phone{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:15px;color:var(--muted);user-select:all}
.d-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.d-body{padding:16px 18px 22px;display:flex;flex-direction:column;gap:18px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--faint);margin:0 0 8px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:10px 12px;border-radius:10px;background:var(--surface-2);min-width:0}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fact input{width:100%;border:0;background:none;padding:0;font-weight:600;font-family:var(--num)}
.stage-pick{display:flex;flex-wrap:wrap;gap:6px}
.stage-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.stage-pick button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.composer{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer textarea{border:0;background:none;resize:vertical;min-height:64px;outline:none;font-size:16px}
.composer-foot{display:flex;gap:8px;align-items:center}
.kinds{display:flex;gap:4px;flex-wrap:wrap}
.kinds button{border:0;background:var(--surface-2);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.kinds button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 16px 20px}
.timeline li::before{content:"";position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline li::after{content:"";position:absolute;left:7.5px;top:18px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline li.intake::before{background:var(--warn)}
.t-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t-body{margin-top:2px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.d-empty{padding:40px 24px;text-align:center;color:var(--muted)}
.d-empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:8px}
/* 차계부 */
.sum-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.money{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
/* 도구 */
.tools{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preview{border-radius:16px;background:var(--surface-2);padding:16px;white-space:pre-wrap;font-size:14.5px;min-height:120px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;max-width:320px}
textarea.input,input.input,select.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
/* 설정 */
.prefs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.seg{display:inline-flex;padding:4px;background:var(--surface-2);border-radius:10px;gap:4px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
/* 팔레트 */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.42);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.palette{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.palette-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.palette-in svg{width:18px;height:18px;color:var(--faint)}
.palette-in input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.palette-list{max-height:52vh;overflow:auto;padding:6px}
.p-group{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);padding:10px 10px 4px}
.p-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:none;border-radius:10px;text-align:left}
.p-item[aria-selected="true"]{background:var(--accent-soft)}
.p-item .sub{margin-left:auto;font-size:12.5px;color:var(--muted)}
.palette-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:19px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.demo-band{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;margin:6px 0 4px}
/* 폰 */
.tabbar,.fab,.sheet-back{display:none}
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr) 360px}.b-calls,.b-week{grid-column:span 12}.b-intake,.b-alerts,.b-funnel{grid-column:span 6}.b-calls{grid-row:auto}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
 .top .btn-label,.search-trigger kbd{display:none}
 .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
 .bento{grid-template-columns:minmax(0,1fr);gap:12px}
 .bento>*{grid-column:auto!important}
 .hello h1{font-size:25px}
 .week{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:42%;overflow-x:auto;scroll-snap-type:x mandatory}
 .day{scroll-snap-align:start}
 .split{grid-template-columns:minmax(0,1fr)}
 .table-wrap{display:none}
 .cards{display:flex}
 .detail{position:fixed;inset:0;z-index:50;border-radius:0;border:0;max-height:none;top:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
 .detail[hidden]{display:none!important}
 .tools,.prefs,.form-grid,.sum-row{grid-template-columns:minmax(0,1fr)}
 .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
 .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--faint);padding:6px 0;position:relative}
 .tabbar svg{width:22px;height:22px}
 .tabbar button[aria-current="page"]{color:var(--accent)}
 .tabbar .badge{position:absolute;top:0;left:56%;transform:scale(.85)}
 .fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:41;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 10px 24px rgba(47,68,232,.35)}
 .fab svg{width:24px;height:24px}
 .overlay{padding-top:8vh}
}
@media (max-width:420px){.d-quick .btn span{display:none}.facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
